server {
    listen 80;
    server_name localhost;

    # Root directory for static production bundle
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for local air-gapped speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck endpoint for Docker orchestration
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"fortress-frontend"}';
        add_header Content-Type application/json;
    }

    # API Proxy to internal FastAPI backend via Docker DNS
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to local 3D globe textures and Leaflet tile server
    location /tiles/ {
        proxy_pass http://asset-server:80/tiles/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header X-Asset-Source "Local-Tile-Cache";
    }

    location /textures/ {
        proxy_pass http://asset-server:80/textures/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header X-Asset-Source "Local-Texture-Cache";
    }

    # Single Page Application fallback routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static Assets caching (JS, CSS, SVGs)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
}
