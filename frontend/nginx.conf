server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { return 200 '{"status":"healthy"}'; add_header Content-Type application/json; }
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /tiles/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
