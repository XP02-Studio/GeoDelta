user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimization for high-throughput static map tiles & textures
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging format optimized for offline latency audits
    log_format airgap '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log airgap;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;

        # Health endpoint for Docker Compose healthcheck
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"fortress-asset-server"}';
            add_header Content-Type application/json;
        }

        # ----------------------------------------------------------------------
        # Leaflet XYZ Map Tiles (/tiles/{z}/{x}/{y}.png)
        # ----------------------------------------------------------------------
        location /tiles/ {
            alias /usr/share/nginx/html/tiles/;
            autoindex off;

            # Aggressive caching headers to mathematically eliminate repeat requests
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header X-Cache-Status "HIT-LOCAL-AIRGAP-TILE";

            # CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }

            try_files $uri $uri.png =404;
        }

        # ----------------------------------------------------------------------
        # react-globe.gl 3D High-Res Textures (/textures/*.jpg, *.png)
        # ----------------------------------------------------------------------
        location /textures/ {
            alias /usr/share/nginx/html/textures/;
            autoindex off;

            # Aggressive immutable caching headers for 3D textures
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header X-Cache-Status "HIT-LOCAL-AIRGAP-TEXTURE";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }

            try_files $uri =404;
        }

        # Default fallback
        location / {
            return 404 '{"error":"Asset not found in local air-gap cache"}';
            add_header Content-Type application/json;
        }
    }
}
